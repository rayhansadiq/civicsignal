version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: civicsignal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: civicsignal
      POSTGRES_PASSWORD: civicsignal
      POSTGRES_DB: civicsignal
    ports:
      - "5432:5432"
    volumes:
      - civicsignal_pgdata:/var/lib/postgresql/data

volumes:
  civicsignal_pgdata:
